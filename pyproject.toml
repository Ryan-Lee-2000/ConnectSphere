[project]
name = "connectsphere"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["Flask>=3.1,<3.2", "SQLAlchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<0.29", "python-dotenv>=1,<2", "gunicorn>=26.2.0,<27"]
[dependency-groups]
dev = ["coverage>=7,<8", "pytest>=8,<9", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "scripts/tests"]
[tool.coverage.run]
branch = true
source = ["app.venue_availability"]
[tool.coverage.report]
show_missing = true
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
